<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>P2P 온라인 갓겜 - 격투 브롤</title>
    <style>
        body {
            background: #141419; color: #fff; font-family: 'Malgun Gothic', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; user-select: none;
        }
        h1 { margin: 0 0 5px 0; color: #ff5722; text-shadow: 0 0 10px rgba(255,87,34,0.3); }
        #menu { background: #1e1e24; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #333; }
        button { padding: 8px 15px; background: #ff5722; border: none; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; margin: 5px; }
        button:hover { background: #ff7043; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2d2d3a; color: white; width: 150px; text-align: center; font-size: 1rem; }
        
        /* 전광판 스타일 */
        #scoreboard {
            display: flex; gap: 40px; background: #1e1e24; padding: 10px 30px; 
            border-radius: 6px; margin-bottom: 15px; border-bottom: 3px solid #ff5722;
            font-size: 1.1rem; font-weight: bold;
        }
        .p1-score { color: #4CAF50; }
        .p2-score { color: #FF5722; }

        canvas { background: #25252e; border: 4px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .info { margin-top: 10px; color: #aaa; font-size: 0.9rem; text-align: center; line-height: 1.4; }
        .skill-info { color: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>💥 P2P JUMP BRAWL</h1>
    
    <div id="scoreboard">
        <div class="p1-score">🟢 플레이어 1 (방장) <br> <span id="p1-kd">0 K / 0 D</span></div>
        <div class="p2-score">🔴 플레이어 2 (게스트) <br> <span id="p2-kd">0 K / 0 D</span></div>
    </div>
    
    <div id="menu">
        <input type="text" id="code-input" placeholder="접속코드 입력" maxlength="6">
        <button onclick="createRoom()">방 만들기</button>
        <button onclick="joinRoom()">방 들어가기</button>
        <div id="status" style="margin-top: 10px; color: #ffeb3b;">원하는 코드를 입력하고 방을 만들거나 들어가세요!</div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div class="info">
        이동: 방향키 ◀ ▶ | 점프: ▲ | 기본공격: 스페이스바(Space) <br>
        <span class="skill-info">🔥 특수 스킬: 에이치(H) 키 -> 바닥에 불장판 설치 (쿨타임 5초)</span>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const p1KdText = document.getElementById('p1-kd');
        const p2KdText = document.getElementById('p2-kd');

        let peer = null;
        let conn = null;
        let isHost = false;
        let gameStarted = false;

        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;

        // 플레이어 데이터 구조 (킬, 데스 추가)
        let myPlayer = { x: 100, y: 360, vx: 0, vy: 0, color: '#4CAF50', hp: 100, kills: 0, deaths: 0, facing: 1, skillCool: 0 };
        let enemyPlayer = { x: 480, y: 360, vx: 0, vy: 0, color: '#FF5722', hp: 100, kills: 0, deaths: 0, facing: -1 };
        
        let projectiles = [];
        let firewalls = []; // 스킬: 불장판 배열

        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false };

        // 초기 랜덤 피어 오브젝트 생성
        peer = new Peer();

        // 1. [방 만들기] 기능: 입력한 코드가 방 ID가 됨
        function createRoom() {
            const code = document.getElementById('code-input').value.trim();
            if (!code) { alert("접속 코드를 입력해 주세요! (예: 1234)"); return; }

            isHost = true;
            // 기존 랜덤 peer 닫고 입력한 코드로 재개설
            peer.destroy();
            
            peer = new Peer(code);
            
            peer.on('open', (id) => {
                statusText.innerText = `🏠 방 개설 완료! 접속코드: [ ${id} ] 등을 친구에게 알려주세요.`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    statusText.innerText = "❌ 이미 누군가 사용 중인 접속코드입니다. 다른 코드를 쓰세요.";
                }
            });
        }

        // 2. [방 들어가기] 기능: 코드를 입력해 방장에게 직접 다이렉트 접속
        function joinRoom() {
            const code = document.getElementById('code-input').value.trim();
            if (!code) { alert("들어가갈 방의 접속코드를 입력하세요!"); return; }

            isHost = false;
            statusText.innerText = `${code} 방에 연결을 시도하는 중...`;
            
            conn = peer.connect(code);
            setupConnection();
        }

        // 3. 네트워킹 연결 완료 핸들러
        function setupConnection() {
            conn.on('open', () => {
                statusText.innerText = "🎮 온라인 연결 성공! 게임 시작!";
                document.getElementById('menu').style.display = 'none';
                gameStarted = true;
                gameLoop();
            });

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    enemyPlayer.x = data.player.x;
                    enemyPlayer.y = data.player.y;
                    enemyPlayer.hp = data.player.hp;
                    enemyPlayer.facing = data.player.facing;
                    enemyPlayer.kills = data.player.kills;
                    enemyPlayer.deaths = data.player.deaths;
                    projectiles = data.projectiles;
                    firewalls = data.firewalls;
